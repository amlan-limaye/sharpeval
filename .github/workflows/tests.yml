name: Test and verify offline packages

'on': [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install the declared build backend
        run: python -m pip install --disable-pip-version-check "setuptools>=68"
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel and source distribution
        run: python -c "import setuptools.build_meta as b; b.build_sdist('dist'); b.build_wheel('dist')"
      - name: Verify clean installs and documented offline examples
        run: python tools/verify_release.py --artifacts dist --evidence output/clean-install.json
