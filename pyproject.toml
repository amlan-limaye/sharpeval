[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sharpeval"
version = "0.4.0"
description = "Transparent conditional cohort evidence rankings and local trading-agent comparisons"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
sharpeval = "sharpeval.cli:main"

[tool.setuptools.packages.find]
include = ["sharpeval*"]
